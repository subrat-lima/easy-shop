<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy Shop</title>
  <link rel="stylesheet" href="css/popup.css">
</head>
<body>
  <div class="container">
    <h2>Easy Shop</h2>
    <hr>
    <div class="checkbox-group">
      <label>
        <input type="checkbox" id="blockAds" checked>
        Block Ads & Sponsored
      </label>
      <label>
        <input type="checkbox" id="blockMRP" checked>
        Hide M.R.P. & Savings
      </label>
      <label>
        <input type="checkbox" id="blockDeal" checked>
        Block Deals & Promos
      </label>
      <label>
        <input type="checkbox" id="blockStats" checked>
        Hide Stats & Scarcity
      </label>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
